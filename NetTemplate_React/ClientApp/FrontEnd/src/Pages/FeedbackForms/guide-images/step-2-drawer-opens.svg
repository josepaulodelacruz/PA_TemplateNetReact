<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" role="img" aria-label="Step 2: the Manage Response panel slides in from the right">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8590c"/>
    </marker>
    <style>
      .f { font-family: Inter, "Segoe UI", system-ui, sans-serif; }
      .ttl { font-size: 13px; font-weight: 700; fill: #212529; }
      .sub { font-size: 9px; fill: #868e96; }
      .lbl { font-size: 10px; font-weight: 600; fill: #212529; }
      .ph { font-size: 10px; fill: #adb5bd; }
      .body { font-size: 10px; fill: #212529; }
      .dim { font-size: 9px; fill: #868e96; }
      .cap { font-size: 8px; font-weight: 700; fill: #868e96; letter-spacing: .5px; }
      .note { font-size: 12px; font-weight: 600; fill: #e8590c; }
      .noteSm { font-size: 11px; fill: #495057; }
      .btn { font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <rect width="920" height="560" fill="#f8f9fa"/>

  <!-- dimmed page behind -->
  <g opacity="0.35">
    <rect x="25" y="30" width="450" height="22" rx="4" fill="#dee2e6"/>
    <rect x="25" y="66" width="450" height="26" rx="3" fill="#e9ecef"/>
    <rect x="25" y="92" width="450" height="28" rx="2" fill="#f1f3f5"/>
    <rect x="25" y="120" width="450" height="28" rx="2" fill="#ffffff" stroke="#dee2e6"/>
    <rect x="25" y="148" width="450" height="28" rx="2" fill="#f1f3f5"/>
    <rect x="25" y="176" width="450" height="28" rx="2" fill="#ffffff" stroke="#dee2e6"/>
  </g>

  <!-- drawer -->
  <rect x="500" y="20" width="400" height="520" rx="10" fill="#ffffff" stroke="#dee2e6"/>
  <g class="f">
    <text x="522" y="48" class="ttl">Manage Response</text>
    <text x="522" y="64" class="sub">Juan Dela Cruz &#8212; Camella Homes &#8226; Blk 4 &#8226; Lot 12</text>
    <text x="874" y="52" class="ttl" fill="#868e96">&#10005;</text>
    <line x1="500" y1="80" x2="900" y2="80" stroke="#dee2e6"/>

    <!-- New update divider -->
    <line x1="522" y1="104" x2="592" y2="104" stroke="#dee2e6"/>
    <text x="660" y="108" text-anchor="middle" class="dim">New update</text>
    <line x1="728" y1="104" x2="878" y2="104" stroke="#dee2e6"/>

    <!-- concern -->
    <text x="522" y="134" class="lbl">Concern <tspan fill="#e03131">*</tspan></text>
    <rect x="522" y="142" width="356" height="52" rx="4" fill="#ffffff" stroke="#ced4da"/>
    <text x="534" y="162" class="ph">Enter the buyer's concern</text>

    <!-- action taken -->
    <text x="522" y="218" class="lbl">Action Taken <tspan fill="#e03131">*</tspan></text>
    <rect x="522" y="226" width="356" height="68" rx="4" fill="#ffffff" stroke="#ced4da"/>
    <text x="534" y="246" class="ph">Describe the action taken to address the concern</text>

    <!-- status -->
    <text x="522" y="318" class="lbl">Status <tspan fill="#e03131">*</tspan></text>
    <rect x="522" y="326" width="356" height="30" rx="4" fill="#ffffff" stroke="#ced4da"/>
    <text x="534" y="346" class="ph">Select status</text>
    <path d="M 856 338 l 6 7 l 6 -7" stroke="#868e96" stroke-width="1.5" fill="none"/>

    <!-- buttons -->
    <text x="770" y="384" text-anchor="middle" class="btn" fill="#868e96">Close</text>
    <rect x="800" y="368" width="78" height="26" rx="5" fill="#228be6"/>
    <text x="839" y="385" text-anchor="middle" class="btn" fill="#ffffff">Save</text>

    <!-- history -->
    <text x="522" y="428" class="lbl">History</text>
    <line x1="530" y1="446" x2="530" y2="512" stroke="#dee2e6" stroke-width="2"/>
    <circle cx="530" cy="452" r="7" fill="#fab005"/>
    <rect x="548" y="444" width="62" height="16" rx="8" fill="#fff9db"/>
    <text x="579" y="456" text-anchor="middle" class="cap" fill="#9C6500">ONGOING</text>
    <text x="620" y="456" class="dim">Feb 10, 2026 &#8226; 9:14 AM</text>
    <text x="548" y="476" class="cap">CONCERN</text>
    <text x="548" y="490" class="body">Reservation papers were released late.</text>
    <text x="548" y="506" class="cap">ACTION TAKEN</text>
    <text x="548" y="520" class="body">Endorsed to Documentation for follow-up.</text>
    <text x="548" y="534" class="dim">by A. Ramos &#8226; 5 days ago</text>
  </g>

  <!-- callouts -->
  <g class="f">
    <path d="M 470 175 L 512 150" stroke="#e8590c" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
    <text x="40" y="270" class="note">2 &#8212; The Manage Response panel opens</text>
    <text x="40" y="292" class="noteSm">The header confirms the buyer and unit you are working on,</text>
    <text x="40" y="309" class="noteSm">so you can check you clicked the right row.</text>

    <path d="M 470 440 L 512 462" stroke="#e8590c" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
    <text x="40" y="360" class="note">Read the History first</text>
    <text x="40" y="382" class="noteSm">Every past update for this response is listed here &#8212; the</text>
    <text x="40" y="399" class="noteSm">concern, the action taken, the status at the time, and who</text>
    <text x="40" y="416" class="noteSm">wrote it. If there are none yet you will see</text>
    <text x="40" y="433" class="noteSm" font-style="italic">&#8220;No history yet &#8212; add the first update below.&#8221;</text>

    <text x="40" y="472" class="noteSm" fill="#868e96">Note: the New update form is only shown if you have</text>
    <text x="40" y="489" class="noteSm" fill="#868e96">Update permission on HomeBuyer Feedback Form.</text>
  </g>
</svg>
